[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "variant-ml-analysis"
version = "0.1.0"
description = "Analysis functions for variant-based binary classification"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "pandas>=1.5", "scikit-learn>=1.2"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
